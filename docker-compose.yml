services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro
      POSTGRES_DB: readings
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "5000:8000"
    environment:
      DATABASE_URL: postgresql://retro:retro@postgres:5432/readings
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
